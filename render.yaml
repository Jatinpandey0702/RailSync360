services:
  # FastAPI Web Application on Render
  - type: web
    name: railsync-backend
    env: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head && python scripts/seed_data.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: APP_PROFILE
        value: PRODUCTION
      - key: DATABASE_URL
        fromDatabase:
          name: railsync-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FIREBASE_ENABLED
        value: "false"
      - key: COSMOS_ENABLED
        value: "false"

  # Background Outbox CDC Worker on Render
  - type: worker
    name: railsync-worker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/run_outbox_worker.py"
    rootDir: backend
    envVars:
      - key: APP_PROFILE
        value: PRODUCTION
      - key: DATABASE_URL
        fromDatabase:
          name: railsync-db
          property: connectionString
      - key: FIREBASE_ENABLED
        value: "false"
      - key: COSMOS_ENABLED
        value: "false"

# Free PostgreSQL Database instance on Render
databases:
  - name: railsync-db
    databaseName: railsync
    user: railsync_user
    plan: free
