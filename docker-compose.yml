version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: railsync_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: railsync_db
      MYSQL_USER: railsync_user
      MYSQL_PASSWORD: railsync_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "railsync_user", "-prailsync_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
